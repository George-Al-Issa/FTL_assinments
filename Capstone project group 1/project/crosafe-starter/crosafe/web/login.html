<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | CroSafe</title><link rel="stylesheet" href="/assets/style.css">
<script type="module" src="/assets/login.js"></script></head>
<body class="login-page"><main>
<section class="panel login-panel">
<p class="brand">CroSafe</p><h1>Sign in</h1>
<form id="login-form">
<label>Username <input name="username" required autocomplete="username"></label>
<label>Password <input name="password" required type="password" autocomplete="current-password"></label>
<button>Sign in</button>
</form><p id="login-status" role="status"></p>
</section></main></body></html>
